dock.offline.steps.disabled.2=Give it a real port in <b>DSH - Settings - QuickDock - Connection</b> (the default is <code>47910</code>), then apply and restart.
dock.offline.steps.disabled.3=Then use the same port here: <b>Connection settings</b>, or <b>Use port detected from QuickDock</b>.
dock.offline.steps.stale.1=This tool window needs the QuickDock <b>app-proxy</b> capability (<code>view=intellij</code>).
dock.offline.steps.stale.2=Update the <b>dsh-quickdock</b> plugin in DSH, then press <b>Retry</b>; the port stays the same.
dock.jcef.title=This IDE cannot show embedded pages
dock.jcef.lead=DSH Dock needs the Java Chromium Embedded Framework (JCEF), which is not available in this IDE session. The dock still works in a browser tab.
dock.jcef.reason.jbr=The IDE is not running on a JetBrains Runtime that includes JCEF (a custom JDK usually does not).
dock.jcef.reason.plugin=On 2026.2 and later the built-in plugin Web Browser (JCEF) must be enabled.
dock.jcef.reason.remote=In remote development and Gateway sessions JCEF is rendered by the client and is often unavailable.


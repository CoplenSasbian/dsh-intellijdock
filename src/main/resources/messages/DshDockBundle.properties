dock.offline.steps.refused.1=Start DSH with the <b>dsh-quickdock</b> plugin installed. The listener starts with DSH.
dock.offline.steps.refused.2=Check the port in <b>DSH - Settings - QuickDock - Connection</b>. It must match the port used here ({0}).

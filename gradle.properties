pluginVersion=0.1.0
kotlin.compiler.execution.strategy=in-process
org.gradle.caching=true
org.gradle.parallel=true
# The build needs ~3 GB. Pass it through the launcher:
#   GRADLE_OPTS="-Xmx3g -Dfile.encoding=UTF-8" ./gradlew --no-daemon build
# A forked daemon would need OS pipes, which the DSH sandbox denies on Windows.
